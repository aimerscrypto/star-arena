  <path d="M62 16 L59.6 40" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round"/>
  <path d="M64 10 L106 86 L94 100 L76 92 L64 102 L52 92 L34 100 L22 86Z" fill="none" stroke="#161b29" stroke-width="2.5" stroke-linejoin="round"/>
