    <rect x="45" y="86" width="12" height="16" rx="2.5"/>
    <rect x="71" y="86" width="12" height="16" rx="2.5"/>
    <path d="M64 10 L106 86 L94 100 L76 92 L64 102 L52 92 L34 100 L22 86Z"/>
  </g>
